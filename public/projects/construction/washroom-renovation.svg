<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0B1B33"/>
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B3158" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid3)" />
  
  <!-- Shower cubicle / glass partition -->
  <rect x="140" y="110" width="220" height="380" fill="#07142A" stroke="#E58A1F" stroke-width="2"/>
  <line x1="360" y1="110" x2="360" y2="490" stroke="#C6A15B" stroke-width="3"/>
  <circle cx="250" cy="160" r="24" fill="none" stroke="#E58A1F" stroke-width="2"/>
  <line x1="250" y1="110" x2="250" y2="136" stroke="#C6A15B" stroke-width="2"/>
  
  <!-- Vanity & Mirror -->
  <rect x="440" y="130" width="180" height="160" rx="90" fill="#1B3158" stroke="#C6A15B" stroke-width="2"/>
  <rect x="410" y="330" width="240" height="120" fill="#07142A" stroke="#E58A1F" stroke-width="2"/>
  <rect x="460" y="350" width="140" height="50" rx="10" fill="#1B3158" stroke="#C6A15B" stroke-width="1.5"/>
  
  <!-- Tiling guidelines -->
  <line x1="410" y1="200" x2="430" y2="200" stroke="#55607A" stroke-width="1"/>
  <line x1="630" y1="200" x2="650" y2="200" stroke="#55607A" stroke-width="1"/>
  <text x="400" y="540" fill="#C6A15B" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle" letter-spacing="2">WASHROOM SPEC // COMPLETE RENOVATION</text>
  <text x="400" y="80" fill="#FFFFFF" font-family="Fraunces, serif" font-size="20" font-weight="600" text-anchor="middle">Washroom Renovations, Start to Finish</text>
</svg>

